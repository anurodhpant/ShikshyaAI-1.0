<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Teacher Portal — Shikshya AI</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<style>body{font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">
<div id="layout-root"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const teacherId = params.get('teacherId');

  let me;
  try { me = await window.API.getMyProfile(); }
  catch (_) { window.location.href = '/auth'; return; }

  const role = me.role === 'superadmin' ? 'superadmin'
             : me.role === 'schooladmin' ? 'schooladmin'
             : me.role === 'teacher' ? 'teacher' : 'student';
  const subMap = { schooladmin:'School Admin', teacher:'Teacher', student:'Student', superadmin:'Super Admin' };
  const avatar = (me.name||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  let schoolName = '', schoolAddr = '';
  if (me.schoolId) {
    try { const s = await window.API.getSchool(me.schoolId); schoolName = s.name; schoolAddr = s.province; } catch(_){}
  }

  window.renderLayout({
    role, active:'teachers',
    userName: me.name, userSub: subMap[role] || 'User', userAvatar: avatar,
    schoolName, schoolAddr
  });

  const content = window.getPageContent();

  if (!teacherId) {
    content.innerHTML = `<p class="text-sm text-[#ba1a1a]">No teacher selected.</p>`;
    return;
  }

  try {
    const t = await window.API.getTeacher(teacherId);
    const avatarT = t.avatar || (t.name || 'T').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

    let uploads = [];
    try {
      const up = await window.API.getUploads();
      uploads = (up.uploads||[]).filter(u => u.uploadedById === t.portalUser);
      if (!uploads.length) uploads = (up.uploads||[]).slice(0,3);
    } catch(_){}

    content.innerHTML = `
      <a href="/teachers-list" class="inline-flex items-center gap-1 text-sm text-[#45464d] hover:text-[#1d4ed8]">
        <span class="material-symbols-outlined text-base">arrow_back</span> Back to teachers
      </a>

      <div class="bg-white border border-[#e2e8f0] rounded-xl p-5">
        <div class="flex items-start gap-4 flex-wrap">
          <div class="w-16 h-16 rounded-full bg-[#7c3aed] text-white flex items-center justify-center text-xl font-bold">${escHtml(avatarT)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="text-2xl font-extrabold tracking-tight">${escHtml(t.name)}</h1>
              <span class="px-2 py-0.5 rounded-md bg-[#ecfdf5] text-[#009668] text-[11px] font-bold border border-[#a7f3d0]">${escHtml(t.status || 'Active')}</span>
            </div>
            <p class="text-sm text-[#45464d] mt-1">${escHtml(t.subject || 'Faculty')} Teacher</p>
            <div class="text-xs text-[#45464d] mt-2 flex flex-wrap gap-x-4 gap-y-1">
              <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">badge</span> ${escHtml(t.id)}</span>
              <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">mail</span> ${escHtml(t.email)}</span>
              <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">call</span> ${escHtml(t.phone || '—')}</span>
              <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">calendar_today</span> Joined ${escHtml(t.joined || '—')}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
          <p class="text-xs font-semibold text-[#45464d]">Classes Taught</p>
          <p class="text-2xl font-extrabold font-mono">${(t.classes||[]).length}</p>
          <p class="text-xs text-[#45464d] mt-1">${(t.classes||[]).map(c => 'Class ' + c).join(' · ') || '—'}</p>
        </div>
        <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
          <p class="text-xs font-semibold text-[#45464d]">Materials Uploaded</p>
          <p class="text-2xl font-extrabold font-mono">${uploads.length}</p>
          <p class="text-xs text-[#45464d] mt-1">Across subjects</p>
        </div>
        <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
          <p class="text-xs font-semibold text-[#45464d]">Teaching Since</p>
          <p class="text-2xl font-extrabold font-mono">${(t.joined||'').slice(0,4) || '—'}</p>
          <p class="text-xs text-[#45464d] mt-1">At this school</p>
        </div>
      </div>

      <div class="bg-white border border-[#e2e8f0] rounded-xl p-5">
        <h2 class="font-bold text-lg mb-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-[#1d4ed8]">library_books</span>
          Recent Course Material
        </h2>
        ${uploads.length ? `
          <div class="space-y-2">
            ${uploads.slice(0,6).map(u => `
              <div class="flex items-center justify-between gap-3 p-3 rounded-lg border border-[#e2e8f0] hover:bg-[#f8fafc]">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-10 h-10 rounded-lg bg-[#eff4ff] text-[#1d4ed8] flex items-center justify-center">
                    <span class="material-symbols-outlined">${iconForExt(u.ext)}</span>
                  </div>
                  <div class="min-w-0">
                    <p class="font-semibold text-sm truncate">${escHtml(u.title || u.originalName)}</p>
                    <p class="text-xs text-[#45464d] font-mono truncate">Class ${escHtml(u.classLevel)} · ${escHtml(u.subject)} · ${u.sizeKB} KB</p>
                  </div>
                </div>
                <a href="${u.url}" target="_blank" rel="noopener" class="px-3 py-1.5 text-xs font-semibold bg-[#1d4ed8] text-white rounded-md flex items-center gap-1">
                  <span class="material-symbols-outlined text-[14px]">open_in_new</span> Open
                </a>
              </div>`).join('')}
          </div>` : `<p class="text-sm text-[#45464d]">No materials uploaded yet.</p>`}
      </div>
    `;
  } catch (err) {
    content.innerHTML = `<p class="text-sm text-[#ba1a1a]">Error loading teacher: ${escHtml(err.message)}</p>`;
  }
});

function iconForExt(ext) {
  const map = { pdf:'picture_as_pdf', doc:'description', docx:'description',
                ppt:'slideshow', pptx:'slideshow', png:'image', jpg:'image', jpeg:'image' };
  return map[(ext||'').toLowerCase()] || 'insert_drive_file';
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
</script>
</body></html>
