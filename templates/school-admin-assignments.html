<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Assignments — Shikshya AI</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<style>body{font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">
<div id="layout-root"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  let me;
  try { me = await window.API.getMyProfile(); }
  catch (_) { window.location.href = '/auth'; return; }

  const role = me.role === 'superadmin' ? 'superadmin'
             : me.role === 'schooladmin' ? 'schooladmin'
             : me.role === 'teacher' ? 'teacher' : 'student';
  const subMap = { schooladmin:'School Admin', teacher:'Teacher', student:'Student', superadmin:'Super Admin' };
  const avatar = (me.name||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  let schoolName = '', schoolAddr = '';
  if (me.schoolId) {
    try { const s = await window.API.getSchool(me.schoolId); schoolName = s.name; schoolAddr = s.province; } catch(_){}
  }

  window.renderLayout({
    role, active:'assignments',
    userName: me.name, userSub: subMap[role] || 'User', userAvatar: avatar,
    schoolName, schoolAddr
  });

  const content = window.getPageContent();
  content.innerHTML = `
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Assignments</h1>
      <p class="text-sm text-[#45464d] mt-0.5">Assignments &amp; materials uploaded by teachers</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
        <p class="text-xs font-semibold text-[#45464d]">Total Assignments</p>
        <p class="text-3xl font-extrabold font-mono" id="statTotal">—</p>
      </div>
      <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
        <p class="text-xs font-semibold text-[#45464d]">Pending</p>
        <p class="text-3xl font-extrabold font-mono text-[#ba1a1a]" id="statPending">—</p>
      </div>
      <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
        <p class="text-xs font-semibold text-[#45464d]">Completed</p>
        <p class="text-3xl font-extrabold font-mono text-[#009668]" id="statCompleted">—</p>
      </div>
    </div>

    <div class="bg-white border border-[#e2e8f0] rounded-xl overflow-hidden">
      <div class="p-4 border-b border-[#e2e8f0] flex items-center gap-2">
        <span class="material-symbols-outlined text-[#1d4ed8]">assignment</span>
        <h2 class="font-bold">All Assignments</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-[#f8fafc] text-[#45464d] border-b border-[#e2e8f0]">
            <tr>
              <th class="text-left p-3 font-semibold">Title</th>
              <th class="text-left p-3 font-semibold">Subject</th>
              <th class="text-left p-3 font-semibold">Class</th>
              <th class="text-left p-3 font-semibold">Due</th>
              <th class="text-left p-3 font-semibold">Uploaded by</th>
              <th class="text-right p-3 font-semibold">Status</th>
            </tr>
          </thead>
          <tbody id="assignmentsRows">
            <tr><td colspan="6" class="p-4 text-[#45464d]">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="bg-white border border-[#e2e8f0] rounded-xl overflow-hidden">
      <div class="p-4 border-b border-[#e2e8f0] flex items-center gap-2">
        <span class="material-symbols-outlined text-[#1d4ed8]">cloud_done</span>
        <h2 class="font-bold">Materials Uploaded by Teachers</h2>
      </div>
      <div id="uploadsList" class="divide-y divide-[#e2e8f0]">
        <p class="p-4 text-sm text-[#45464d]">Loading…</p>
      </div>
    </div>`;

  try {
    const { assignments } = await window.API.getAssignments();
    const rows = document.getElementById('assignmentsRows');
    const total = (assignments || []).length;
    const pending = (assignments || []).filter(a => a.status === 'Pending').length;
    const completed = (assignments || []).filter(a => a.status === 'Completed').length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statCompleted').textContent = completed;

    if (!total) {
      rows.innerHTML = `<tr><td colspan="6" class="p-4 text-sm text-[#45464d]">No assignments yet.</td></tr>`;
    } else {
      rows.innerHTML = assignments.map(a => `
        <tr class="border-b border-[#f1f5f9] hover:bg-[#f8fafc]">
          <td class="p-3 font-semibold">${escHtml(a.title)}</td>
          <td class="p-3 text-[#45464d]">${escHtml(a.subject)}</td>
          <td class="p-3 text-[#45464d]">Class ${escHtml(a.classLevel)}</td>
          <td class="p-3 text-[#45464d] font-mono text-xs">${escHtml(a.due)}</td>
          <td class="p-3 text-[#45464d]">${escHtml(a.uploadedBy || 'Teacher')}</td>
          <td class="p-3 text-right">
            <span class="px-2 py-0.5 rounded-md text-xs font-bold ${
              a.status === 'Completed'
                ? 'bg-[#ecfdf5] text-[#009668] border border-[#a7f3d0]'
                : 'bg-[#fef3c7] text-[#92400e] border border-[#fde68a]'
            }">${escHtml(a.status)}</span>
          </td>
        </tr>`).join('');
    }
  } catch (_) {}

  try {
    const { uploads } = await window.API.getUploads();
    const list = document.getElementById('uploadsList');
    if (!uploads || !uploads.length) {
      list.innerHTML = `<p class="p-4 text-sm text-[#45464d]">No materials uploaded yet. Teachers can upload from their dashboard.</p>`;
    } else {
      list.innerHTML = uploads.map(u => `
        <div class="p-4 flex items-center justify-between gap-3 hover:bg-[#f8fafc]">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-lg bg-[#eff4ff] text-[#1d4ed8] flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-xl">${iconForExt(u.ext)}</span>
            </div>
            <div class="min-w-0">
              <p class="font-semibold text-sm truncate">${escHtml(u.title || u.originalName)}</p>
              <p class="text-xs text-[#45464d] font-mono truncate">
                ${escHtml(u.subject)} · Class ${escHtml(u.classLevel)} · ${u.sizeKB} KB · by ${escHtml(u.uploadedBy)}
              </p>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <a href="${u.url}" target="_blank" rel="noopener"
               class="px-3 py-1.5 text-xs font-semibold border border-[#c6c6cd] hover:bg-[#eff4ff] rounded-md flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px]">open_in_new</span> Open
            </a>
            <a href="${u.url}" download
               class="px-3 py-1.5 text-xs font-semibold bg-[#1d4ed8] hover:bg-[#1e40af] text-white rounded-md flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px]">download</span> Download
            </a>
          </div>
        </div>`).join('');
    }
  } catch (_) {}

  function iconForExt(ext) {
    const map = { pdf:'picture_as_pdf', doc:'description', docx:'description',
                  ppt:'slideshow', pptx:'slideshow', png:'image', jpg:'image', jpeg:'image' };
    return map[(ext||'').toLowerCase()] || 'insert_drive_file';
  }
});

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
</script>
</body></html>
