<script>

    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (!nav || nav.type !== 'back_forward') return;
      if (window.location.pathname.startsWith('/school-admin')) window.location.replace('/auth');
    } catch (_) {}
  })();
</script>
