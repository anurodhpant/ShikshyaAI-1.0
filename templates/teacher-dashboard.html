<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Teacher Dashboard - SHIKSHYA AI</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg"/>
<script>
  (function() {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (!nav || nav.type !== 'back_forward') return;
      if (window.location.pathname.startsWith('/teacher')) window.location.replace('/auth?role=teacher');
    } catch (_) {}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<style>body{font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body data-role="teacher" class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">
<div id="layout-root"></div>

<!-- Add Student Modal -->
<div id="addUserModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xl font-bold" id="addUserTitle">Add Student</h3>
      <button type="button" onclick="closeUserModal()" class="text-[#76777d] hover:text-black">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="addUserForm" class="space-y-3" onsubmit="submitUserForm(event)">
      <input type="hidden" id="u_role" value="student"/>
      <div>
        <label class="block text-xs font-semibold text-[#45464d] mb-1">Full Name <span class="text-[#ba1a1a]">*</span></label>
        <input id="u_name" type="text" required class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#45464d] mb-1">Email <span class="text-[#ba1a1a]">*</span></label>
        <input id="u_email" type="email" required class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#45464d] mb-1">Phone No.</label>
        <input id="u_phone" type="tel" class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#45464d] mb-1">Location (Address)</label>
        <input id="u_address" type="text" class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white"/>
      </div>
      <input type="hidden" id="u_schoolId"/>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-[#45464d] mb-1">Class</label>
          <select id="u_classLevel" class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white">
            <option value="6">Class 6</option><option value="7">Class 7</option>
            <option value="8">Class 8</option><option value="9">Class 9</option>
            <option value="10" selected>Class 10</option><option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#45464d] mb-1">Section</label>
          <input id="u_section" type="text" value="A" class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white"/>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#45464d] mb-1">Password</label>
        <input id="u_password" type="text" value="password123" class="w-full px-3 py-2 border border-[#c6c6cd] rounded-lg text-sm bg-white"/>
      </div>
      <div id="u_error" class="hidden text-sm text-[#ba1a1a] bg-[#ffdad6] border border-[#fecaca] rounded-lg px-3 py-2"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeUserModal()" class="px-4 py-2 border border-[#c6c6cd] rounded-lg text-sm font-semibold">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-[#1d4ed8] hover:bg-[#1e40af] text-white rounded-lg text-sm font-semibold">Add Student</button>
      </div>
    </form>
  </div>
</div>

<script src="/static/js/api.js?v=105"></script>
<script src="/static/js/nav.js?v=105"></script>
<script src="/static/js/layout.js?v=105"></script>
<script src="/static/js/teacher.js?v=105"></script>
</body></html>
