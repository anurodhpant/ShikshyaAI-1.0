<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Course Material — Shikshya AI</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg"/>
<script>
  (function() {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (!nav || nav.type !== 'back_forward') return;
      if (window.location.pathname.startsWith('/course-material')) window.location.replace('/auth');
    } catch (_) {}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .file-card{transition:.15s;}
  .file-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(29,78,216,.10);border-color:#1d4ed8;}
</style>
</head>
<body data-role="student" class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">
<div id="layout-root"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/layout.js"></script>
<script>
const PARAMS = new URLSearchParams(window.location.search);
const Q_CLASS = PARAMS.get('class') || '';
const Q_SUBJECT = PARAMS.get('subject') || '';

document.addEventListener('DOMContentLoaded', async () => {
  let me;
  try { me = await window.API.getMyProfile(); }
  catch (_) { window.location.href = '/auth'; return; }

  const role = me.role === 'superadmin' ? 'superadmin'
             : me.role === 'schooladmin' ? 'schooladmin'
             : me.role === 'teacher' ? 'teacher' : 'student';
  const subMap = { schooladmin:'School Admin', teacher:'Teacher', student:'Student', superadmin:'Super Admin' };
  const avatar = (me.name||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  let schoolName = '', schoolAddr = '';
  if (me.schoolId) {
    try { const s = await window.API.getSchool(me.schoolId); schoolName = s.name; schoolAddr = s.province; } catch(_){}
  }

  window.renderLayout({
    role, active:'materials',
    userName: me.name, userSub: subMap[role] || 'User', userAvatar: avatar,
    schoolName, schoolAddr
  });

  const content = window.getPageContent();
  content.innerHTML = `
    <div>
      <a href="/course-materials-list" class="inline-flex items-center gap-1 text-sm text-[#45464d] hover:text-[#1d4ed8] mb-2">
        <span class="material-symbols-outlined text-base">arrow_back</span> Back to subjects
      </a>
      <div class="flex items-start gap-4">
        <div class="w-14 h-14 rounded-xl bg-[#dbeafe] flex items-center justify-center text-[#1d4ed8] shrink-0">
          <span class="material-symbols-outlined text-3xl">menu_book</span>
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight" id="pageTitle">${escHtml(Q_SUBJECT || 'Course Material')}</h1>
          <p class="text-sm text-[#45464d] mt-1" id="pageSubtitle">${Q_CLASS ? 'Class ' + escHtml(Q_CLASS) : 'All classes'}</p>
        </div>
      </div>
    </div>

    <div class="bg-[#eff6ff] border border-[#dbeafe] rounded-xl p-4 flex items-start gap-3">
      <span class="material-symbols-outlined text-[#1d4ed8]">info</span>
      <p class="text-sm text-[#0b1c30]">Click <strong>Open</strong> to view a PDF in your browser, or <strong>Download</strong> to save it.</p>
    </div>

    <div id="filesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <div id="emptyState" class="hidden text-center py-16 bg-white border border-dashed border-[#c6c6cd] rounded-xl">
      <span class="material-symbols-outlined text-5xl text-[#76777d]">folder_off</span>
      <p class="text-base font-semibold mt-3">No material uploaded yet</p>
      <p class="text-sm text-[#45464d] mt-1">Check back later — your teacher hasn't posted files for this subject.</p>
    </div>`;

  try {
    const { uploads } = await window.API.getUploads();
    const filtered = (uploads || []).filter(u => {
      const clsOk = !Q_CLASS || String(u.classLevel) === String(Q_CLASS);
      const subOk = !Q_SUBJECT || String(u.subject).toLowerCase() === Q_SUBJECT.toLowerCase();
      return clsOk && subOk;
    });

    const grid = document.getElementById('filesGrid');
    const empty = document.getElementById('emptyState');

    if (!filtered.length) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    grid.innerHTML = filtered.map(u => {
      const isPdf = (u.ext || '').toLowerCase() === 'pdf';
      const isImg = ['png','jpg','jpeg'].includes((u.ext || '').toLowerCase());
      const canOpen = isPdf || isImg;
      return `
        <div class="file-card bg-white border border-[#e2e8f0] rounded-xl p-4 flex flex-col">
          <div class="flex items-start gap-3">
            <div class="w-11 h-11 rounded-lg bg-[#eff4ff] text-[#1d4ed8] flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-2xl">${iconForExt(u.ext)}</span>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="font-bold text-sm truncate">${escHtml(u.title || u.originalName)}</h3>
              <p class="text-xs text-[#45464d] font-mono truncate mt-0.5">Class ${escHtml(u.classLevel)} · ${escHtml(u.subject)}</p>
              <p class="text-[11px] text-[#76777d] mt-0.5">${u.sizeKB} KB · ${escHtml(u.uploadedBy || '')}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 mt-4">
            ${canOpen ? `
              <a href="${u.url}" target="_blank" rel="noopener" class="flex-1 py-2 rounded-lg bg-[#1d4ed8] hover:bg-[#1e40af] text-white text-sm font-semibold flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-base">open_in_new</span> Open
              </a>` : ''}
            <a href="${u.url}" download class="${canOpen ? 'flex-1' : 'w-full'} py-2 rounded-lg border border-[#c6c6cd] hover:bg-[#eff4ff] text-sm font-semibold flex items-center justify-center gap-1.5">
              <span class="material-symbols-outlined text-base">download</span> Download
            </a>
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    document.getElementById('filesGrid').innerHTML = `<div class="col-span-full text-center py-8 text-sm text-[#ba1a1a]">Error: ${escHtml(err.message)}</div>`;
  }
});

function iconForExt(ext) {
  const map = { pdf:'picture_as_pdf', doc:'description', docx:'description',
                ppt:'slideshow', pptx:'slideshow', png:'image', jpg:'image', jpeg:'image' };
  return map[(ext||'').toLowerCase()] || 'insert_drive_file';
}
function escHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
</script>
</body></html>
