<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Report — Shikshya AI</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<style>body{font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">
<div id="layout-root"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const studentId = params.get('studentId');

  let me;
  try { me = await window.API.getMyProfile(); }
  catch (_) { window.location.href = '/auth'; return; }

  const role = me.role === 'superadmin' ? 'superadmin'
             : me.role === 'schooladmin' ? 'schooladmin'
             : me.role === 'teacher' ? 'teacher' : 'student';
  const subMap = { schooladmin:'School Admin', teacher:'Teacher', student:'Student', superadmin:'Super Admin' };
  const avatar = (me.name||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  let schoolName = '', schoolAddr = '';
  if (me.schoolId) {
    try { const s = await window.API.getSchool(me.schoolId); schoolName = s.name; schoolAddr = s.province; } catch(_){}
  }

  window.renderLayout({
    role, active:'progress',
    userName: me.name, userSub: subMap[role] || 'User', userAvatar: avatar,
    schoolName, schoolAddr
  });

  const content = window.getPageContent();

  if (!studentId) {
    content.innerHTML = `<p class="text-sm text-[#ba1a1a]">No student selected.</p>`;
    return;
  }

  content.innerHTML = `<p class="text-sm text-[#45464d]">Loading report…</p>`;

  try {
    const report = await window.API.studentReport(studentId);
    const s = report.student;

    // Build conic-gradient pie from subject scores
    const colors = ['#1d4ed8', '#16a34a', '#d97706', '#dc2626', '#0891b2'];
    let cumulative = 0;
    const stops = report.subjects.map((sub, i) => {
      const start = cumulative;
      cumulative += sub.score;
      return `${colors[i % colors.length]} ${start}deg ${cumulative}deg`;
    }).join(', ');
    const totalScore = cumulative || 1;
    const scale = 360 / totalScore;
    const gradientStops = report.subjects.map((sub, i) => {
      const start = (report.subjects.slice(0, i).reduce((a,b) => a + b.score, 0)) * scale;
      const end = start + sub.score * scale;
      return `${colors[i % colors.length]} ${start}deg ${end}deg`;
    }).join(', ');

    content.innerHTML = `
      <a href="/school-admin/student-progress" class="inline-flex items-center gap-1 text-sm text-[#45464d] hover:text-[#1d4ed8]">
        <span class="material-symbols-outlined text-base">arrow_back</span> Back to students
      </a>

      <div class="bg-white border border-[#e2e8f0] rounded-xl p-5">
        <div class="flex items-start gap-4 flex-wrap">
          <div class="w-16 h-16 rounded-full bg-[#16a34a] text-white flex items-center justify-center text-xl font-bold">${escHtml(s.avatar||'ST')}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="text-2xl font-extrabold tracking-tight">${escHtml(s.name)}</h1>
              <span class="px-2 py-0.5 rounded-md bg-[#eff6ff] text-[#1d4ed8] text-[11px] font-bold">Class ${escHtml(s.classLevel)} · Sec ${escHtml(s.section||'A')}</span>
            </div>
            <div class="text-xs text-[#45464d] mt-2 flex flex-wrap gap-x-4 gap-y-1">
              <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">badge</span>Roll ${s.roll||'—'}</span>
              <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">mail</span>${escHtml(s.email)}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="bg-white border border-[#e2e8f0] rounded-xl p-5 lg:col-span-2">
          <div class="flex items-center gap-2 mb-3">
            <span class="material-symbols-outlined text-[#1d4ed8]">pie_chart</span>
            <h2 class="font-bold">Subject Performance</h2>
          </div>
          <div class="flex flex-col sm:flex-row items-center gap-6">
            <div class="relative w-44 h-44">
              <div class="w-full h-full rounded-full" style="background: conic-gradient(${gradientStops});"></div>
              <div class="absolute inset-6 rounded-full bg-white flex flex-col items-center justify-center">
                <p class="text-3xl font-extrabold font-mono">${report.overall}%</p>
                <p class="text-[10px] text-[#45464d]">Overall</p>
              </div>
            </div>
            <div class="flex-1 space-y-2 w-full">
              ${report.subjects.map((sub, i) => `
                <div class="flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full" style="background:${colors[i % colors.length]}"></span>
                  <span class="text-sm flex-1 truncate">${escHtml(sub.subject)}</span>
                  <span class="text-sm font-mono font-bold">${sub.score}%</span>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
            <p class="text-xs font-semibold text-[#45464d]">Predicted GPA</p>
            <p class="text-3xl font-extrabold font-mono">${report.gpa}</p>
          </div>
          <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
            <p class="text-xs font-semibold text-[#45464d]">Grade</p>
            <p class="text-3xl font-extrabold font-mono">${report.grade}</p>
          </div>
          <div class="bg-white border border-[#e2e8f0] rounded-xl p-4">
            <p class="text-xs font-semibold text-[#45464d]">Attendance</p>
            <p class="text-3xl font-extrabold font-mono">${report.attendance}%</p>
          </div>
        </div>
      </div>

      <div class="bg-white border border-[#e2e8f0] rounded-xl p-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-[#1d4ed8]">insights</span>
          <h2 class="font-bold">Subject-wise Bars</h2>
        </div>
        <div class="space-y-2.5">
          ${report.subjects.map((sub, i) => `
            <div class="flex items-center gap-2">
              <span class="w-40 text-xs text-[#45464d] truncate">${escHtml(sub.subject)}</span>
              <div class="flex-1 bg-[#e5eeff] rounded-full h-2">
                <div class="h-2 rounded-full" style="width:${sub.score}%; background:${colors[i % colors.length]};"></div>
              </div>
              <span class="text-xs font-mono font-bold w-10 text-right">${sub.score}%</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="bg-[#ecfdf5] border border-[#a7f3d0] rounded-xl p-4 flex items-start gap-3">
        <span class="material-symbols-outlined text-[#16a34a]">lightbulb</span>
        <div class="text-sm text-[#0b1c30]">
          <p class="font-semibold">AI Remarks</p>
          <p class="text-[#45464d] mt-0.5">${escHtml(report.remarks)}</p>
        </div>
      </div>
    `;
  } catch (err) {
    content.innerHTML = `<p class="text-sm text-[#ba1a1a]">Error loading report: ${escHtml(err.message)}</p>`;
  }
});

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
</script>
</body></html>
