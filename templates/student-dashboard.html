<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Dashboard - SHIKSHYA AI</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg"/>
<script>
  (function() {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (!nav || nav.type !== 'back_forward') return;
      if (window.location.pathname.startsWith('/student')) window.location.replace('/auth?role=student');
    } catch (_) {}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css"/>
<style>
  body{font-family:'Plus Jakarta Sans',sans-serif;}
  .grade-pill{cursor:pointer;transition:.15s;}
  .grade-pill.active{background:#1d4ed8!important;color:#fff!important;border-color:#1d4ed8!important;}
  .grade-pill.active *{color:#fff!important;}
  .subject-card{transition:.18s;}
  .subject-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(29,78,216,.12);border-color:#1d4ed8;}
</style>
</head>
<body data-role="student" class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen">
<div id="layout-root"></div>

<script src="/static/js/api.js?v=107"></script>
<script src="/static/js/nav.js?v=107"></script>
<script src="/static/js/layout.js?v=107"></script>
<script src="/static/js/student.js?v=107"></script>
</body></html>
